name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run check

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  postgres-and-production-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rendant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rendant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rendant_test
      DATABASE_CONNECTION_TIMEOUT_MS: 2000
      DATABASE_QUERY_TIMEOUT_MS: 10000
      BETTER_AUTH_SECRET: integration-test-secret-at-least-32-bytes
      BETTER_AUTH_URL: http://127.0.0.1:3000
      RENDANT_INTEGRATION_TEST: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply production migrations
        run: bun run db:migrate:prod

      - name: Run PostgreSQL integration tests
        run: bun run test:integration
        env:
          DATABASE_QUERY_TIMEOUT_MS: 1000

      - name: Build production image
        run: docker build --tag rendant-ci .

      - name: Verify image migrations
        run: >-
          docker run --rm
          --add-host=host.docker.internal:host-gateway
          -e DATABASE_URL=postgres://postgres:postgres@host.docker.internal:5432/rendant_test
          -e DATABASE_CONNECTION_TIMEOUT_MS=2000
          -e DATABASE_QUERY_TIMEOUT_MS=5000
          -e BETTER_AUTH_SECRET=integration-test-secret-at-least-32-bytes
          -e BETTER_AUTH_URL=http://127.0.0.1:3000
          rendant-ci bun src/server/db/migrate.ts

      - name: Start production image
        run: >-
          docker run --detach --name rendant-ci-app
          --add-host=host.docker.internal:host-gateway
          -p 3000:3000
          -e DATABASE_URL=postgres://postgres:postgres@host.docker.internal:5432/rendant_test
          -e DATABASE_CONNECTION_TIMEOUT_MS=2000
          -e DATABASE_QUERY_TIMEOUT_MS=5000
          -e BETTER_AUTH_SECRET=integration-test-secret-at-least-32-bytes
          -e BETTER_AUTH_URL=http://127.0.0.1:3000
          rendant-ci

      - name: Check production readiness including PDF rendering
        run: >-
          curl --silent --fail --retry 20 --retry-delay 1 --retry-all-errors
          http://127.0.0.1:3000/api/health
          | jq --exit-status
          '.ok == true and .db == true and .pdf == true and .pdfLatencyMs >= 0'

      - name: Show production logs on failure
        if: failure()
        run: docker logs rendant-ci-app || true

      - name: Stop production image
        if: always()
        run: docker rm --force rendant-ci-app || true
